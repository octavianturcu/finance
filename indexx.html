function cleanImportValue(v){return String(v??'').replace(/\u00a0/g,' ').trim()}
function normaliseRuleValue(v){let raw=cleanImportValue(v),key=raw.toUpperCase().replace(/[\s_\-]+/g,' ').trim(),compact=key.replace(/\s+/g,''),a={'DIRECT MOVE':'DIRECT MOVE','DIRECT LOAD':'DIRECT MOVE','DIRECT':'DIRECT MOVE','MOVE':'DIRECT MOVE','DIRECTMOVE':'DIRECT MOVE','DIRECTLOAD':'DIRECT MOVE','CONSTANT':'CONSTANT','DEFAULT':'CONSTANT','FIXED VALUE':'CONSTANT','FIXED':'CONSTANT','EXPRESSION':'EXPRESSION','FORMULA':'EXPRESSION','CALCULATION':'EXPRESSION','CALCULATED':'EXPRESSION','VALUE MAPPING':'VALUE MAPPING','VALUE MAP':'VALUE MAPPING','VALUEMAPPING':'VALUE MAPPING','VALUEMAP':'VALUE MAPPING','LOOKUP':'VALUE MAPPING'},r=a[key]||a[compact];if(!r)throw Error('Unsupported rule value: '+(raw||'(empty)'));return r}
function matchCatalogValue(value,list,fallback=''){let v=cleanImportValue(value);if(!v)return fallback;return(list||[]).find(x=>cleanImportValue(x).toLowerCase()===v.toLowerCase())||v}
function normaliseImportMap(x){let rule=normaliseRuleValue(x.rule||'DIRECT MOVE'),source=matchCatalogValue(x.source,db.sources,'');if(!source)source=rule==='CONSTANT'?matchCatalogValue('S/4HANA Default',db.sources,'S/4HANA Default'):rule==='VALUE MAPPING'?matchCatalogValue('Value Mapping File',db.sources,'Value Mapping File'):matchCatalogValue('SAP ECC',db.sources,'SAP ECC');let sr=cleanImportValue(x.status||'Draft').toLowerCase(),sm={'draft':'Draft','in review':'In review','inreview':'In review','review':'In review','validated':'Validated','validate':'Validated','obsolete':'Obsolete'};return{id:cleanImportValue(x.id),object:matchCatalogValue(x.object,db.objects,''),company:matchCatalogValue(x.company,db.companies,'General Rule'),source,sourceTable:cleanImportValue(x.sourceTable),sourceField:cleanImportValue(x.sourceField),sheet:cleanImportValue(x.sheet),description:cleanImportValue(x.description),targetTable:cleanImportValue(x.targetTable),targetField:cleanImportValue(x.targetField),rule,logic:cleanImportValue(x.logic),jira:cleanImportValue(x.jira).toUpperCase(),status:sm[sr]||cleanImportValue(x.status)||'Draft'}}
async function saveImportedMap(m,existing){let data={object:m.object,company:m.company,source:m.source,sourceTable:m.sourceTable,sourceField:m.sourceField,sheet:m.sheet,description:m.description,targetTable:m.targetTable,targetField:m.targetField,rule:m.rule,logic:m.logic,jira:m.jira,status:m.status};let r=await sbClient.rpc('save_mapping',{p_id:existing?.id||null,p_expected_version:existing?.version||0,p_data:data});if(r.error)throw r.error}
async function deleteScopeMaps(scope){let rows=scope?db.maps.filter(m=>m.object===scope):[...db.maps];for(let m of rows){let r=await sbClient.rpc('soft_delete_mapping',{p_id:m.id,p_expected_version:m.version});if(r.error)throw r.error}}
async function importCloudFile(file){if(!file)return;if(!['editor','admin'].includes(currentProfile.role))return alert('Editor role required.');let scope=document.querySelector('#transferObject')?.value||'';try{isBulkImport=true;pendingRealtimeRefresh=false;clearTimeout(realtimeRefreshTimer);cloudMessage('● Importing…');let text=await file.text(),maps,pack=null;if(cloudImportMode==='json'){pack=JSON.parse(text);if(!Array.isArray(pack.maps))throw Error('Invalid JSON: maps array is missing.');maps=pack.maps.map(normaliseImportMap);scope=''}else{let rows=parseCSV(text.replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV has no data rows.');let headers=rows.shift().map(normaliseCsvHeader);maps=rows.map(z=>normaliseImportMap(Object.fromEntries(headers.map((k,i)=>[k,z[i]||'']))));if(scope){let wrong=maps.filter(m=>cleanImportValue(m.object).toLowerCase()!==cleanImportValue(scope).toLowerCase());if(wrong.length)throw Error('The selected object is '+scope+', but the CSV contains other objects.')}}if(!maps.length)throw Error('No mappings found in the file.');for(let [index,m] of maps.entries()){let missing=[];if(!m.object)missing.push('object');if(!m.targetTable)missing.push('targetTable');if(!m.targetField)missing.push('targetField');if(missing.length)throw Error('Row '+(index+2)+' is missing: '+missing.join(', ')+'. Company, source, source table, source field, sheet, description, logic, Jira and status are optional.');}if(cloudImportMode==='replace'||cloudImportMode==='json'){let label=scope||'ALL OBJECTS';if(!confirm('Replace '+label+' with '+maps.length+' imported mappings? This changes shared Supabase data.'))return;await deleteScopeMaps(scope)}if(pack){for(let [kind,list] of [['source',pack.sources],['object',pack.objects],['company',pack.companies]])for(let name of (Array.isArray(list)?list:[])){let exists=await sbClient.from('etl_catalog_items').select('id,active').eq('kind',kind).eq('name',name).maybeSingle();if(exists.error)throw exists.error;if(!exists.data){let added=await sbClient.from('etl_catalog_items').insert({kind,name,created_by:currentUser.id});if(added.error)throw added.error}else if(!exists.data.active){let enabled=await sbClient.from('etl_catalog_items').update({active:true}).eq('id',exists.data.id);if(enabled.error)throw enabled.error}}if(pack.settings){db.settings=pack.settings;save()}}let current=(cloudImportMode==='replace'||cloudImportMode==='json')?[]:[...db.maps];let done=0;for(let m of maps){let existing=m.id?current.find(x=>String(x.id)===String(m.id)):null;await saveImportedMap(m,existing);done++}await loadCloud(true);render();cloudMessage('● Synced');alert('Import completed: '+done+' mappings.')}catch(e){cloudMessage('● Import failed',true);alert('Import failed: '+e.message)}finally{isBulkImport=false;if(pendingRealtimeRefresh){pendingRealtimeRefresh=false;scheduleRealtimeRefresh()}}}
async function saveConnection(){let url=document.querySelector('#sbUrl').value.trim(),key=document.querySelector('#sbKey').value.trim();localStorage.setItem('smm10_supabase',JSON.stringify({url,key}));location.reload()}
async function testConnection(){try{let {error}=await sbClient.from('etl_profiles').select('id').limit(1);if(error)throw error;alert('Connection and authenticated access are working.')}catch(e){alert('Connection failed: '+e.message)}}
async function renderUsers(){let box=document.querySelector('#userAdmin');if(!box)return;if(currentProfile?.role!=='admin'){box.innerHTML='<div class="notice">Only an administrator can manage users.</div>';return}let [{data:users,error:uerr},{data:invites,error:ierr}]=await Promise.all([sbClient.from('etl_profiles').select('*').order('email'),sbClient.from('etl_user_invites').select('*').order('created_at',{ascending:false})]);if(uerr||ierr){box.textContent=(uerr||ierr).message;return}box.innerHTML=`<div class="add"><input id="inviteEmail" type="email" placeholder="Email"><input id="inviteName" placeholder="Display name"><select id="inviteRole"><option>viewer</option><option>editor</option><option>admin</option></select><button class="btn primary" onclick="inviteUser()">Add invitation</button></div>${users.map(u=>`<div class="userrow"><span>${esc(u.display_name||u.email)}<br><small class="muted">${esc(u.email)}</small></span><select onchange="updateUser('${u.id}','role',this.value)"><option ${u.role==='viewer'?'selected':''}>viewer</option><option ${u.role==='editor'?'selected':''}>editor</option><option ${u.role==='admin'?'selected':''}>admin</option></select><select onchange="updateUser('${u.id}','active',this.value)"><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Inactive</option></select><span></span></div>`).join('')}<h3>Pending invitations</h3>${invites.filter(x=>!x.accepted_at).map(i=>`<div class="userrow"><span>${esc(i.email)}</span><span>${esc(i.role)}</span><span>Pending</span><button class="btn danger" onclick="deleteInvite('${i.id}')">Remove</button></div>`).join('')||'<p class="muted">No pending invitations.</p>'}`}
async function inviteUser(){let row={email:document.querySelector('#inviteEmail').value.trim().toLowerCase(),display_name:document.querySelector('#inviteName').value.trim(),role:document.querySelector('#inviteRole').value,invited_by:currentUser.id};if(!row.email)return alert('Enter an email address.');let found=await sbClient.from('etl_user_invites').select('id').ilike('email',row.email).maybeSingle();if(found.error)return alert(found.error.message);let result=found.data?await sbClient.from('etl_user_invites').update({...row,accepted_at:null,accepted_by:null}).eq('id',found.data.id):await sbClient.from('etl_user_invites').insert(row);if(result.error)return alert(result.error.message);renderUsers()}
async function updateUser(id,field,value){if(id===currentUser.id&&field==='active'&&value==='false')return alert('You cannot deactivate your current session.');let patch={[field]:field==='active'?value==='true':value};let {error}=await sbClient.from('etl_profiles').update(patch).eq('id',id);if(error)alert(error.message);else renderUsers()}
async function deleteInvite(id){let {error}=await sbClient.from('etl_user_invites').delete().eq('id',id);if(error)alert(error.message);else renderUsers()}
window.saveMap=async function(e,id){e.preventDefault();if(!['editor','admin'].includes(currentProfile.role))return alert('Editor role required.');let d=Object.fromEntries(new FormData(e.target));d.logic=document.querySelector('#editor').innerHTML;d.jira=d.jira.toUpperCase();let existing=id?db.maps.find(x=>String(x.id)===String(id)):null;cloudMessage('● Saving…');let {error}=await sbClient.rpc('save_mapping',{p_id:existing?.id||null,p_expected_version:existing?.version||0,p_data:d});if(error){cloudMessage('● Save conflict',true);if(error.message.includes('CONFLICT')){await loadCloud();alert('This mapping was changed by another user. Shared data was reloaded and your change was not overwritten.');return}return alert(error.message)}closeM();await loadCloud();render();cloudMessage('● Synced')}
window.deleteEdit=async function(id){if(!confirm('Delete this rule for all users?'))return;let m=db.maps.find(x=>String(x.id)===String(id));let {error}=await sbClient.rpc('soft_delete_mapping',{p_id:m.id,p_expected_version:m.version});if(error)return alert(error.message);closeM();await loadCloud();render()}
window.addCat=async function(k){if(!['editor','admin'].includes(currentProfile.role))return alert('Editor role required.');let name=document.querySelector('#a'+k).value.trim(),kind={sources:'source',objects:'object',companies:'company'}[k];if(!name)return;let {error}=await sbClient.from('etl_catalog_items').insert({kind,name,created_by:currentUser.id});if(error)alert(error.message);else await loadCloud().then(render)}
window.rename=async function(k,v){if(!['editor','admin'].includes(currentProfile.role))return alert('Editor role required.');let n=prompt('New value',v);if(!n||!n.trim())return;let kind={sources:'source',objects:'object',companies:'company'}[k];let {error}=await sbClient.from('etl_catalog_items').update({name:n.trim()}).eq('kind',kind).eq('name',v);if(error)alert(error.message);else await loadCloud().then(render)}
window.delCat=async function(k,v){if(!['editor','admin'].includes(currentProfile.role))return alert('Editor role required.');let field={sources:'source',objects:'object',companies:'company'}[k];if(db.maps.some(m=>m[field]===v))return alert('Value is used by a mapping.');let kind={sources:'source',objects:'object',companies:'company'}[k];let {error}=await sbClient.from('etl_catalog_items').update({active:false}).eq('kind',kind).eq('name',v);if(error)alert(error.message);else await loadCloud().then(render)}
initApp();

</script></body></html>
